apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-master-config
  namespace: mysql-repl
data:
  my.cnf: |
    [mysqld]
    server-id=1
    log-bin=mysql-bin
    gtid_mode=ON
    enforce-gtid-consistency=ON
    binlog_format=ROW
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-master-init
  namespace: mysql-repl
data:
  init-replication.sql: |
    CREATE USER IF NOT EXISTS 'repl_user'@'%' IDENTIFIED WITH mysql_native_password BY 'replpass123';
    GRANT REPLICATION SLAVE ON *.* TO 'repl_user'@'%';
    FLUSH PRIVILEGES;
