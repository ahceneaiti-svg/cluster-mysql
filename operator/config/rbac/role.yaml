---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: mysql-operator
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - get
  - list
  - watch
- apiGroups:
  - mysql.aia.local
  resources:
  - mysqlbackups
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - mysql.aia.local
  resources:
  - mysqlbackups/finalizers
  verbs:
  - update
- apiGroups:
  - mysql.aia.local
  resources:
  - mysqlbackups/status
  - mysqlbackupschedules/status
  - mysqlrestores/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - mysql.aia.local
  resources:
  - mysqlbackupschedules
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - mysql.aia.local
  resources:
  - mysqlrestores
  verbs:
  - get
  - list
  - patch
  - update
  - watch
